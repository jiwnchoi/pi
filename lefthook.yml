pre-commit:
  piped: true
  jobs:
    - name: oxlint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,md,yml,yaml,toml,css,scss,html,vue,svelte}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: tsrs
      run: pnpm typecheck
